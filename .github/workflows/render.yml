
name: Render Motion Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Install Remotion browser
        run: npx remotion browser ensure

      - name: Render video
        run: npm run build

      - name: Upload MP4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-motion-video
          path: out/effort.mp4
          if-no-files-found: warn
